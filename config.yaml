# Phase 3 configuration: Multi-Strategy Blocking and Candidate Generation.
#
# Dataset filenames are intentionally absent. Files are discovered under
# `dataset.root` and classified from their own path and file stem, so the
# configuration stays valid if the upstream archive is renamed or re-extracted.
project:
  name: amazon-ml-entity-resolution
  phase: 3

paths:
  data_root: data
  raw_dir: data/raw
  processed_dir: data/processed
  train_dir: data/train
  validation_dir: data/validation
  test_dir: data/test
  experiments_dir: experiments
  output_dir: output

# Local copy of the supplied challenge archive. This directory is excluded from
# Git tracking and is never modified by the pipeline.
dataset:
  root: dataset
  # Phase 1 and Phase 2 are train-only. The test split is discovered for a
  # structural availability check and is never read for analysis or fitting.
  read_split: train
  recursive: true
  extensions: [".tsv", ".csv", ".txt"]
  ignore_globs:
    - "**/__MACOSX/**"
    - "**/.DS_Store"
    - "**/._*"
    - "**/Thumbs.db"
    - "**/*.md"
  split_keywords:
    train: train
    test: test
  source_keywords: ["source"]
  ground_truth_keywords: ["ground_truth", "groundtruth", "labels"]
  delimiter: "\t"
  encoding: utf-8
  header_rows: 1
  chunksize: 250000
  # Deterministic leading-row sample used for the exploratory pattern battery.
  sample_rows: 250000
  # Deterministic linked-pair sample used to surface real variation examples.
  pair_sample_rows: 20000
  top_values: 25
  max_examples: 8

# Conservative, train-derived comparison rules. These build extra
# representations; they never decide that two records are the same entity.
# Every rule table below is populated only from patterns observed in the
# training sources, and every table is safe to extend for later phases.
normalization:
  text:
    unicode_form: NFKC
    strip_control_characters: true
    casefold: true
    collapse_whitespace: true
    punctuation_to_space: true
    strip_symbols: true
    keep_characters: "&'-.#,/"
    ampersand_to_and: true
  name:
    # Trailing corporate-form tokens observed in the training names.
    general_legal_suffixes: {}
    # Conservative whole-token expansions observed in the training names.
    abbreviations: {}
  address:
    street_designators: {}
    unit_markers: {}
    direction_tokens: {}
    address_tokens: {}
  country:
    # Open set: labels are cleaned but never mapped to a fixed country universe.
    open_set: true
    case: lower
  tokens:
    char_ngram_sizes: [3, 4]
    token_sort: false
    min_token_length: 1
  diagnostics:
    over_normalized_length_ratio: 0.4

random_seed: 2026

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  date_format: "%Y-%m-%dT%H:%M:%S"

experiments:
  retain_history: true
  metadata_format: json

# Model selection and hyperparameters are deferred until Phase 3.
models:
  primary: null
  benchmark: null
  options: {}

# Phase 3 Multi-Strategy Candidate Blocking Configuration
blocking:
  strategies:
    - exact
    - name_token
    - address_token
    - char_ngram
    - tfidf
  options:
    exact:
      enabled: true
      max_block_size: 5000
    name_token:
      enabled: true
      min_token_length: 3
      max_token_frequency: 10000
      max_candidates_per_query: 50
    address_token:
      enabled: true
      max_block_size: 5000
      max_candidates_per_query: 50
    char_ngram:
      enabled: true
      ngram_size: 3
      min_length: 3
      top_k: 20
      min_overlap: 0.35
    tfidf:
      enabled: true
      top_k_name: 10
      top_k_address: 5
      min_similarity: 0.15
      batch_size: 2000
    candidate_limits:
      max_candidates_per_anchor: 100
      partition_by_country: true

# Macro F0.5 is the official metric; no threshold is selected before Phase 3.
evaluation:
  metric: macro_f_beta
  beta: 0.5
  threshold_grid: []
  validation_unit: entity
